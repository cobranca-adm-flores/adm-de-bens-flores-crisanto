<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADM de Bens Flores Crisanto</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f9;margin:0;color:#172033}
header{background:#173b67;color:white;padding:25px;text-align:center}
main{max-width:900px;margin:30px auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #0001}
.card h2{font-size:19px}
button{background:#1764ad;color:white;border:0;border-radius:7px;padding:12px;cursor:pointer}
footer{text-align:center;margin:30px;color:#666}
</style>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><h1>ADM de Bens Flores Crisanto</h1><p>Administração de imóveis e aluguéis</p></header>
<main>
<h2>Painel administrativo</h2>
 <button onclick="loginAdministrador()">Entrar como administrador</button>
<div class="grid">
<section class="card"><h2>Imóveis</h2><p>Cadastro e gestão de imóveis</p><button onclick="carregarImoveis()">Acessar</button></section>
 <div id="listaImoveis"></div>
<button onclick="cadastrarImovel()">+ Cadastrar imóvel</button>
<section class="card"><h2>Inquilinos</h2><p>Cadastro de inquilinos</p><button onclick="aviso()">Acessar</button></section>
<section class="card"><h2>Pagamentos</h2><p>Recebidos, pendentes e atrasados</p><button onclick="aviso()">Acessar</button></section>
<section class="card"><h2>Relatórios</h2><p>Resumo financeiro</p><button onclick="aviso()">Acessar</button></section>
</div>
</main>
<footer>ADM de Bens Flores Crisanto</footer>
<script>
 async function loginAdministrador() {
  const email = prompt("Digite seu e-mail:");
  if (!email) return;

  const senha = prompt("Digite sua senha:");
  if (!senha) return;

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const { error } = await db.auth.signInWithPassword({
    email: email,
    password: senha
  });

  if (error) {
    alert("Erro no login: " + error.message);
    return;
  }

  alert("Login realizado com sucesso!");
}
const SUPABASE_URL = "https://mstzwpfiijzqagqjifmf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wpFiv-tgK9zW9EFqmEn3aQ_EW4rQ4DJ";
 async function carregarImoveis() {
  try {
    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const { data, error } = await db
      .from("properties")
      .select("name")
      .limit(20);

    if (error) {
      alert("Erro na consulta: " + error.message);
      return;
    }

    if (!data || data.length === 0) {
      alert("Nenhum imóvel encontrado.");
      return;
    }

 const lista = document.getElementById("listaImoveis");
lista.replaceChildren();

data.forEach(imovel => {
  const item = document.createElement("p");
  item.textContent = imovel.name;
  lista.appendChild(item);
});
  } catch (erro) {
    alert("Erro: " + erro.message);
  }
}
  function abrirImoveis() {
  const nome = prompt("Digite o nome do imóvel:");
  if (nome === null) return;
  if (!nome.trim()) {
    alert("Digite um nome válido.");
    return;
  }
  alert("Imóvel informado: " + nome + "\nCadastro de teste. Ainda não foi salvo.");
}
function aviso(){alert("Funcionalidade em desenvolvimento.")}
 
async function cadastrarImovel() {
  const nome = prompt("Digite o nome do imóvel:");
  if (!nome || !nome.trim()) return;

  alert("Próxima etapa: salvar o imóvel no banco de dados.");
}

</script>
</body>
</html>
