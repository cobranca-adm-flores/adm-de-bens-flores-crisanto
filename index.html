 async function loginAdministrador() {
  const email = prompt("Digite seu e-mail:");
  if (!email) return;

  const senha = prompt("Digite sua senha:");
  if (!senha) return;

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const { error } = await db.auth.signInWithPassword({
    email: email,
    password: senha
  });

  if (error) {
    alert("Erro no login: " + error.message);
    return;
  }

  alert("Login realizado com sucesso!");
}

async function cadastrarImovel() {
  const nome = prompt("Digite o nome do imóvel:");
  if (!nome || !nome.trim()) return;
const endereco = prompt("Digite o endereço do imóvel:");
if (!endereco || !endereco.trim()) return;
  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const { data: { user }, error: authError } =
    await db.auth.getUser();

  if (authError || !user) {
    alert("Entre como administrador primeiro.");
    return;
  }

  const { error } = await db
    .from("properties")
  .insert({
  name: nome.trim(),
  address: endereco.trim(),
  owner_id: user.id
});

  if (error) {
    alert("Erro ao cadastrar: " + error.message);
    return;
  }

  alert("Imóvel cadastrado com sucesso!");
  await carregarImoveis();
}
async function editarImovel(imovel) {
  const novoNome = prompt("Novo nome do imóvel:", imovel.name);
  if (novoNome === null || !novoNome.trim()) return;

  const novoEndereco = prompt("Novo endereço:", imovel.address || "");
  if (novoEndereco === null || !novoEndereco.trim()) return;

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const { data: { user }, error: authError } = await db.auth.getUser();

  if (authError || !user) {
    alert("Entre como administrador primeiro.");
    return;
  }

  const { error } = await db
    .from("properties")
    .update({
      name: novoNome.trim(),
      address: novoEndereco.trim()
    })
    .eq("id", imovel.id)
    .eq("owner_id", user.id);

  if (error) {
    alert("Erro ao editar: " + error.message);
    return;
  }

  alert("Imóvel atualizado com sucesso!");
  await carregarImoveis();
}
 async function excluirImovel(imovel) {
  const confirmar = confirm(
    "Tem certeza que deseja excluir o imóvel " +
    imovel.name + "?"
  );

  if (!confirmar) return;

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const { data: { user }, error: authError } =
    await db.auth.getUser();

  if (authError || !user) {
    alert("Entre como administrador primeiro.");
    return;
  }

  const { error } = await db
    .from("properties")
    .delete()
    .eq("id", imovel.id)
    .eq("owner_id", user.id);

  if (error) {
    alert("Erro ao excluir: " + error.message);
    return;
  }

  alert("Solicitação de exclusão concluída.");
  await carregarImoveis();
}

async function cadastrarInquilino() {
  const nome = prompt("Nome completo do inquilino:");
  if (!nome || !nome.trim()) return;

  const telefone = prompt("Telefone do inquilino:");
  if (telefone === null) return;

  const cpf = prompt("CPF do inquilino:");
  if (cpf === null) return;

  try {
    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const { data: { user }, error: authError } =
      await db.auth.getUser();

    if (authError || !user) {
      alert("Entre como administrador primeiro.");
      return;
    }

    const { error } = await db
      .from("tenants")
      .insert({
        full_name: nome.trim(),
        phone: telefone.trim(),
        document_ref: cpf.trim(),
        owner_id: user.id
      });

    if (error) {
      alert("Erro ao cadastrar: " + error.message);
      return;
    }

    alert("Inquilino cadastrado com sucesso!");
  } catch (erro) {
    alert("Erro: " + erro.message);
  }
}
async function carregarInquilinos() {

  try {

      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const { data: { user }, error: authError } =
      await db.auth.getUser();

    if (authError || !user) {
      lista.textContent = "Entre como administrador primeiro.";
      return;
    }

    const { data, error } = await db
      .from("tenants")
      .select("id, full_name")
      .eq("owner_id", user.id)
      .order("full_name");

    if (error) throw error;

    lista.replaceChildren();

      return;
    }

   data.forEach(inquilino => {

  excluir.onclick = () => excluirInquilino(inquilino);

  item.append(nome, editar, excluir);
  lista.appendChild(item);
});

  } catch (erro) {

}

      await db.auth.getUser();

    if (authError || !user) {
      alert("Entre como administrador primeiro.");

    const { data, error } = await db
      .from("tenants")

async function carregarPagamentos() {
  const lista = document.getElementById("listaPagamentos");
  lista.textContent = "Carregando pagamentos...";

  try {
    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const { data: { user }, error: authError } =
      await db.auth.getUser();

    if (authError || !user) {
      lista.textContent = "Entre como administrador primeiro.";
      return;
    }

    const { data, error } = await db
      .from("rent_charges")
      .select("description, amount, due_date, status")
      .eq("owner_id", user.id)
      .order("due_date", { ascending: false });

    if (error) throw error;

    lista.replaceChildren();

    if (!data || data.length === 0) {
      lista.textContent = "Nenhuma cobrança encontrada.";
      return;
    }

    const hoje = new Date().toLocaleDateString("en-CA", {
      timeZone: "America/Sao_Paulo"
    });

    data.forEach(cobranca => {
      const item = document.createElement("p");

      const situacao = cobranca.status === "paid"
        ? "PAGO"
        : cobranca.due_date < hoje
          ? "ATRASADO"
          : "PENDENTE";

      const valor = Number(cobranca.amount)
        .toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL"
        });

      item.textContent =
        cobranca.description + " - " +
        valor + " - " + situacao;

      lista.appendChild(item);
    });

  } catch (erro) {
    lista.textContent = "Erro: " + erro.message;
  }
}


async function carregarRelatorios() {
  const lista = document.getElementById("listaPagamentos");
  if (!lista) {
    alert("Abra primeiro a seção de Pagamentos.");
    return;
  }

  try {
    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const { data: usuario } = await db.auth.getUser();
    if (!usuario.user) {
      alert("Entre como administrador primeiro.");
      return;
    }

    const { data, error } = await db
      .from("rent_charges")
      .select("amount,status,due_date")
      .eq("owner_id", usuario.user.id);

    if (error) throw error;

    let recebido = 0;
    let pendente = 0;
    let atrasado = 0;
    const hoje = new Date().toISOString().slice(0, 10);

    for (const cobranca of data || []) {
      const valor = Number(cobranca.amount) || 0;
      if (cobranca.status === "paid") {
        recebido += valor;
      } else if (cobranca.due_date < hoje) {
        atrasado += valor;
      } else {
        pendente += valor;
      }
    }

    const moeda = valor => valor.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

  
document.getElementById("resumoFinanceiro").innerHTML = `
  <p><strong>Recebido:</strong> ${moeda(recebido)}</p>
  <p><strong>Pendente:</strong> ${moeda(pendente)}</p>
  <p><strong>Atrasado:</strong> ${moeda(atrasado)}</p>
`;

  } catch (erro) {
    alert("Erro no relatório: " + erro.message);
  }
}


async function registrarPagamento() {
  try {
    const descricao = prompt("Digite a descrição da cobrança que foi paga:");
    if (!descricao) return;

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const { data: { user }, error: erroUsuario } = await db.auth.getUser();
    if (erroUsuario || !user) {
      alert("Entre como administrador primeiro.");
      return;
    }

    const { data: cobrancas, error } = await db
      .from("rent_charges")
      .select("id, description, amount, status")
      .eq("owner_id", user.id)
      .ilike("description", "%" + descricao.trim() + "%");

    if (error) throw error;

    if (!cobrancas || cobrancas.length !== 1) {
      alert("Encontradas " + (cobrancas?.length || 0) +
        " cobranças. Digite uma descrição mais específica.");
      return;
    }

    const cobranca = cobrancas[0];

    if (cobranca.status === "paid") {
      alert("Essa cobrança já está marcada como paga.");
      return;
    }

    const confirmar = confirm(
      "Confirmar recebimento de " + cobranca.description +
      " no valor de R$ " + Number(cobranca.amount).toFixed(2) + "?"
    );
    if (!confirmar) return;

try {
  const { error: erroPagamento } = await db
    .from("payments")
    .insert({
      owner_id: user.id,
      charge_id: cobranca.id,
      paid_at: new Date().toLocaleDateString("en-CA"),
      amount: Number(cobranca.amount)
    });

  if (erroPagamento) throw erroPagamento;

  const { error: erroAtualizacao } = await db
    .from("rent_charges")
    .update({ status: "paid" })
    .eq("id", cobranca.id)
    .eq("owner_id", user.id);

  if (erroAtualizacao) throw erroAtualizacao;

    alert("Cobrança marcada como paga!");
    await carregarPagamentos();
    await carregarRelatorios();
  } catch (erro) {
    alert("Erro ao registrar pagamento: " + erro.message);
    } 
  }
</script>
